<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" role="img" aria-labelledby="title desc">
  <title id="title">A11yLTLNav: a dialog focus property</title>
  <desc id="desc">Opening a dialog should move keyboard focus inside it. The expected state has focus on a control inside the dialog; the failure state leaves focus on the button behind the dialog. Blue outlines indicate keyboard focus. This is an illustrative property example.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#27333d}
      .muted{fill:#62717d}.label{font-size:25px;font-weight:700}
      .small{font-size:19px}.focus{fill:none;stroke:#2476d8;stroke-width:5}
    </style>
    <pattern id="shade" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e9eef2"/></pattern>
  </defs>
  <rect width="820" height="620" rx="16" fill="#fff"/>
  <text x="38" y="42" font-size="17" font-weight="700" letter-spacing="1.5" fill="#16715d">A11yLTLNav · PROPERTY EXAMPLE</text>
  <text x="38" y="91" font-size="37" font-weight="700">Open dialog → move focus inside</text>
  <text x="38" y="128" font-size="22" class="muted">Check what happens after an interaction.</text>

  <circle cx="54" cy="177" r="15" fill="#e4f3ec"/>
  <path d="m46 177 5 5 10-11" fill="none" stroke="#14745b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="79" y="185" class="label">Expected</text>
  <circle cx="445" cy="177" r="15" fill="#fbe9e7"/>
  <path d="m439 171 12 12m0-12-12 12" fill="none" stroke="#ba423b" stroke-width="3" stroke-linecap="round"/>
  <text x="470" y="185" class="label">Navigation failure</text>

  <g>
    <rect x="38" y="206" width="355" height="254" rx="12" fill="#f7f9fa" stroke="#becbd4" stroke-width="2"/>
    <rect x="38" y="206" width="355" height="32" rx="12" fill="#e9eef2"/>
    <circle cx="56" cy="222" r="4" fill="#a1afb9"/><circle cx="70" cy="222" r="4" fill="#a1afb9"/><circle cx="84" cy="222" r="4" fill="#a1afb9"/>
    <rect x="59" y="253" width="132" height="37" rx="6" fill="#dde5eb"/>
    <text x="72" y="278" font-size="17" fill="#687783">Open dialog</text>
    <rect x="73" y="303" width="286" height="130" rx="10" fill="#fff" stroke="#96b9ac" stroke-width="2"/>
    <text x="92" y="334" font-size="21" font-weight="700">Dialog</text>
    <path d="m333 317 11 11m0-11-11 11" stroke="#6b7c86" stroke-width="2"/>
    <rect x="92" y="349" width="246" height="9" rx="4" fill="#e6ecef"/>
    <rect x="92" y="368" width="183" height="9" rx="4" fill="#e6ecef"/>
    <rect x="235" y="386" width="101" height="33" rx="5" fill="#eef4f8"/>
    <text x="251" y="409" font-size="18">Continue</text>
    <rect x="229" y="380" width="113" height="45" rx="8" class="focus"/>
  </g>
  <g>
    <rect x="427" y="206" width="355" height="254" rx="12" fill="#f7f9fa" stroke="#becbd4" stroke-width="2"/>
    <rect x="427" y="206" width="355" height="32" rx="12" fill="#e9eef2"/>
    <circle cx="445" cy="222" r="4" fill="#a1afb9"/><circle cx="459" cy="222" r="4" fill="#a1afb9"/><circle cx="473" cy="222" r="4" fill="#a1afb9"/>
    <rect x="448" y="253" width="132" height="37" rx="6" fill="#dde5eb"/>
    <text x="461" y="278" font-size="17">Open dialog</text>
    <rect x="442" y="247" width="144" height="49" rx="8" class="focus"/>
    <rect x="462" y="303" width="286" height="130" rx="10" fill="#fff" stroke="#c5cfd6" stroke-width="2"/>
    <text x="481" y="334" font-size="21" font-weight="700">Dialog</text>
    <path d="m722 317 11 11m0-11-11 11" stroke="#6b7c86" stroke-width="2"/>
    <rect x="481" y="349" width="246" height="9" rx="4" fill="#e6ecef"/>
    <rect x="481" y="368" width="183" height="9" rx="4" fill="#e6ecef"/>
    <rect x="624" y="386" width="101" height="33" rx="5" fill="#eef4f8"/>
    <text x="640" y="409" font-size="18">Continue</text>
  </g>
  <text x="215" y="490" text-anchor="middle" font-size="23" fill="#14745b">Focus enters the dialog</text>
  <text x="604" y="490" text-anchor="middle" font-size="23" fill="#ba423b">Focus stays behind</text>

  <rect x="38" y="514" width="744" height="61" rx="10" fill="#f2f6f8"/>
  <text x="410" y="552" text-anchor="middle" font-family="monospace" font-size="24">G(openModal(d) → X(focusInside(d)))</text>
  <text x="410" y="603" text-anchor="middle" font-size="17" class="muted">Illustrative example · Blue outline = keyboard focus</text>
</svg>
