name: Split monthly rent
on:
  schedule:
    - cron: '15 13 1 * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/split-rent.yml'
      - 'split/scripts/sync-rent.mjs'
permissions:
  contents: write
concurrency:
  group: split-monthly-rent
  cancel-in-progress: false
jobs:
  apply-rent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply due rent and verify persistent data
        run: node split/scripts/sync-rent.mjs
      - name: Save the execution receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add split/data/rent-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(split): record monthly rent verification'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
